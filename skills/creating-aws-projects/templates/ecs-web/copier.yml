_subdirectory: template
_templates_suffix: .jinja

project_name:
  type: str
  help: Lowercase name, 3-32 chars, letters, digits and hyphens
  validator: "{% if not (project_name | regex_search('^[a-z][a-z0-9-]{1,30}[a-z0-9]$')) %}invalid project_name{% endif %}"

aws_region:
  type: str
  default: us-east-1

environment:
  type: str
  default: dev
  validator: "{% if not (environment | regex_search('^[a-z][a-z0-9]{1,15}$')) %}invalid environment{% endif %}"

public_reason:
  type: str
  default: ""
  help: Why anyone who reaches the load balancer may call the service; it has no authentication
  validator: "{% if (public_reason | trim | length) < 10 %}public_reason: the service has no authentication; give a reason of at least 10 characters{% endif %}"

runtime:
  type: str
  choices: [python3.13]
  default: python3.13

architecture:
  type: str
  choices: [arm64]
  default: arm64

cpu:
  type: int
  choices: [256, 512, 1024]
  default: 256

memory:
  type: int
  default: 512
  help: MiB; Fargate accepts 512-2048 for 256 CPU, 1024-4096 for 512, 2048-8192 for 1024
  validator: "{% if not ((cpu == 256 and memory in [512, 1024, 2048]) or (cpu == 512 and memory in [1024, 2048, 3072, 4096]) or (cpu == 1024 and memory in [2048, 3072, 4096, 5120, 6144, 7168, 8192])) %}memory: Fargate does not accept {{ memory }} MiB with {{ cpu }} CPU{% endif %}"

min_tasks:
  type: int
  default: 1
  validator: "{% if min_tasks < 1 %}min_tasks: at least 1{% endif %}"

max_tasks:
  type: int
  default: 2
  validator: "{% if max_tasks < min_tasks or max_tasks > 20 %}max_tasks: between min_tasks and 20{% endif %}"

network_name:
  type: str
  default: ""
  help: A network made with the network template (<project>-<environment>). Leave empty only to give subnet_ids
  validator: "{% if network_name and not (network_name | regex_search('^[a-z][a-z0-9-]{1,48}$')) %}network_name: the network project's <project>-<environment>{% endif %}"

subnet_ids:
  type: str
  default: ""
  help: Comma-separated subnet IDs from your platform team, in at least two zones, when there is no network project
  validator: "{% if network_name and subnet_ids %}subnet_ids: give network_name or subnet_ids, not both{% elif not network_name and not (subnet_ids | regex_search('^subnet-[0-9a-f]+(,subnet-[0-9a-f]+)+$')) %}subnet_ids: give network_name (a network made with the network template) or at least two subnet IDs; the default VPC is not used{% endif %}"

secret_names:
  type: str
  default: ""
  help: Comma-separated environment variable names the app reads as secrets, such as DB_PASSWORD. Their values go in Secrets Manager, never in Terraform
  validator: "{% if secret_names and not (secret_names | regex_search('^[A-Z_][A-Z0-9_]*(,[A-Z_][A-Z0-9_]*)*$')) %}secret_names: upper-case environment variable names separated by commas, such as DB_PASSWORD,API_TOKEN{% endif %}"

log_retention_days:
  type: int
  default: 14
  validator: "{% if log_retention_days not in [1, 3, 5, 7, 14, 30, 60, 90, 120, 150, 180, 365, 400, 545, 731, 1096, 1827, 2192, 2557, 2922, 3288, 3653] %}log_retention_days: not a value CloudWatch Logs accepts{% endif %}"

alarm_email:
  type: str
  default: ""

allowed_account_id:
  type: str
  default: ""
  validator: "{% if allowed_account_id and not (allowed_account_id | regex_search('^[0-9]{12}$')) %}allowed_account_id: empty or a 12-digit account ID{% endif %}"

backend:
  type: str
  choices: [local, s3]
  default: local

state_bucket:
  type: str
  default: ""
  validator: "{% if backend == 's3' and not state_bucket %}state_bucket: required for the s3 backend{% endif %}"

state_key:
  type: str
  default: ""
  validator: "{% if backend == 's3' and not state_key %}state_key: required for the s3 backend{% endif %}"
