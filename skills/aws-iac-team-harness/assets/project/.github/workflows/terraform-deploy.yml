# Plan the merged main commit with a read-mostly role, then apply that exact saved plan
# after a reviewer approves the environment. Repository settings this relies on, which
# this file cannot enforce: branch protection on main, required reviewers on the
# environment, and IAM trust policies that accept only this repository's main branch
# (plan role) and this environment (apply role). See the harness SKILL.md.
name: terraform-deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terraform-state-${{ vars.TF_ENVIRONMENT || 'dev' }}
  cancel-in-progress: false

env:
  TF_ROOT: ${{ vars.TF_ROOT || 'infra' }}
  TF_ENVIRONMENT: ${{ vars.TF_ENVIRONMENT || 'dev' }}
  AWS_REGION: ${{ vars.AWS_REGION }}
  TERRAFORM_VERSION: "1.14.4"

jobs:
  plan:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          role-session-name: plan-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Plan
        run: |
          terraform -chdir="$TF_ROOT" init -input=false -lockfile=readonly
          terraform -chdir="$TF_ROOT" plan -input=false -var-file="envs/$TF_ENVIRONMENT.tfvars" -out=tfplan
      - name: Policy scan and summary (values are not printed)
        run: |
          pip install checkov==3.4.3
          terraform -chdir="$TF_ROOT" show -json tfplan > "$RUNNER_TEMP/plan.json"
          python harness/plan_summary.py "$RUNNER_TEMP/plan.json" >> "$GITHUB_STEP_SUMMARY"
          checkov -f "$RUNNER_TEMP/plan.json" --framework terraform_plan --external-checks-dir harness/checkov \
            --repo-root-for-plan-enrichment "$TF_ROOT" --compact --quiet --skip-download
          rm -f "$RUNNER_TEMP/plan.json"
      - name: Bind the plan to this commit and target
        run: |
          python harness/plan_provenance.py write "$TF_ROOT/tfplan" "$TF_ROOT/plan-meta.json" \
            --commit "$GITHUB_SHA" \
            --account "$(aws sts get-caller-identity --query Account --output text)" \
            --region "$AWS_REGION" --root "$TF_ROOT" --environment "$TF_ENVIRONMENT" \
            --terraform-version "$TERRAFORM_VERSION" \
            --backend "$(jq -r '.backend.type + ":" + (.backend.config.bucket // "") + "/" + (.backend.config.key // "")' "$TF_ROOT/.terraform/terraform.tfstate")"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tfplan-${{ github.sha }}
          path: |
            ${{ env.TF_ROOT }}/tfplan
            ${{ env.TF_ROOT }}/plan-meta.json
          retention-days: 1
          if-no-files-found: error

  apply:
    if: github.ref == 'refs/heads/main'
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: ${{ vars.TF_ENVIRONMENT || 'dev' }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_APPLY_ROLE_ARN }}
          role-session-name: apply-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tfplan-${{ github.sha }}
          path: ${{ env.TF_ROOT }}
      - name: Verify the plan is the approved one, for this commit and target
        run: |
          terraform -chdir="$TF_ROOT" init -input=false -lockfile=readonly
          python harness/plan_provenance.py verify "$TF_ROOT/tfplan" "$TF_ROOT/plan-meta.json" \
            --commit "$GITHUB_SHA" \
            --account "$(aws sts get-caller-identity --query Account --output text)" \
            --region "$AWS_REGION" --root "$TF_ROOT" --environment "$TF_ENVIRONMENT" \
            --terraform-version "$(terraform version -json | jq -r .terraform_version)" \
            --backend "$(jq -r '.backend.type + ":" + (.backend.config.bucket // "") + "/" + (.backend.config.key // "")' "$TF_ROOT/.terraform/terraform.tfstate")"
      - name: Apply the saved plan
        run: terraform -chdir="$TF_ROOT" apply -input=false tfplan
