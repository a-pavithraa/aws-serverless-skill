metadata:
  id: "HARNESS_AWS_4"
  name: "Dead-letter queue without an alarm: messages that land here are failed work, and nobody is told. Add aws_cloudwatch_metric_alarm on ApproximateNumberOfMessagesVisible with dimensions QueueName = this queue's name"
  category: "LOGGING"
# A dead-letter queue is a queue that another aws_sqs_queue references while it has no redrive_policy
# of its own (the source queue has the redrive_policy). Graph connections have no direction, so the
# redrive_policy attribute tells the two apart.
definition:
  and:
    - cond_type: "filter"
      attribute: "resource_type"
      value:
        - "aws_sqs_queue"
      operator: "within"
    - or:
        - cond_type: "connection"
          resource_types:
            - "aws_sqs_queue"
          connected_resource_types:
            - "aws_sqs_queue"
          operator: "not_exists"
        - cond_type: "attribute"
          resource_types:
            - "aws_sqs_queue"
          attribute: "redrive_policy"
          operator: "exists"
        - cond_type: "connection"
          resource_types:
            - "aws_sqs_queue"
          connected_resource_types:
            - "aws_cloudwatch_metric_alarm"
          operator: "exists"
